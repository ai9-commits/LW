<!DOCTYPE html>

<link rel="stylesheet" href="style.css">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NWV2W1CSQT"></script>

window.dataLayer = window.dataLayer || [];

gtag('js', new Date());

<body>

<!-- header -->
<div id="header"></div>

<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("header").innerHTML = data;
  })

<main>

  <div class="timer-title-bar">
    <h1>Timer</h1>
    <div class="view-switcher" role="group" aria-label="表示位置の切り替え">
      <button type="button" class="view-btn" data-view="left" title="左端にスリム配置">◀ Left</button>
      <button type="button" class="view-btn active" data-view="center" title="標準の中央配置">■ Center</button>
      <button type="button" class="view-btn" data-view="right" title="右端にスリム配置">Right ▶</button>
    </div>
  </div>

  <p class="page-description">
    複数のカウントダウンタイマーや指定時刻タイマーを同時に管理できます。
  </p>


  <!-- Timer settings -->
  <section class="tool-section">

    <!-- Label -->
    <div class="form-row compact-row">

      <label class="label-option emoji-option">
        <input type="radio" name="labelType" value="🎁" checked>
        <span>🎁</span>
      </label>

      <label class="label-option emoji-option">
        <input type="radio" name="labelType" value="📘">
        <span>📘</span>
      </label>

      <label class="label-option emoji-option">
        <input type="radio" name="labelType" value="⚔️">
        <span>⚔️</span>
      </label>

      <label class="label-option emoji-option">
        <input type="radio" name="labelType" value="🍙">
        <span>🍙</span>
      </label>

      <label class="label-option emoji-option">
        <input type="radio" name="labelType" value="🦑">
        <span>🦑</span>
      </label>

      <label class="label-option emoji-option">
        <input type="radio" name="labelType" value="🛸">
        <span>🛸</span>
      </label>

      <label class="label-option text-option">
        <input type="radio" name="labelType" value="text">
        <span></span>
      </label>

      <input
        type="text"
        id="memoText"
        class="memo-mini"
        maxlength="5"
        placeholder="memo">

    </div>


    <!-- Mode and time -->
    <div class="form-row compact-row">

      <label>
        <input type="radio" name="mode" value="duration" checked>
        残り
      </label>

      <label>
        <input type="radio" name="mode" value="target">
        時刻
      </label>

      <input
        type="text"
        id="timeInput"
        placeholder="15:30 / 1530 / 00:15:30"
        inputmode="numeric"
        class="time-input">

    </div>


    <!-- Sound -->
    <div class="form-row compact-row">

      <button
        type="button"
        class="mini-button icon-button"
        id="testSoundBtn"
        title="試聴">
        ▶
      </button>


      <div class="volume-group">

        <label>
          <input type="radio" name="volume" value="0">
          🔇
        </label>

        <label>
          <input type="radio" name="volume" value="0.08">
          🔈
        </label>

        <label>
          <input type="radio" name="volume" value="0.2" checked>
          🔉
        </label>

        <label>
          <input type="radio" name="volume" value="0.45">
          🔊
        </label>

        <label>
          <input type="radio" name="volume" value="1.0">
          📢
        </label>

      </div>

    </div>


    <!-- Add timer -->
    <div class="form-row add-row">

      <button
        class="btn-primary add-timer-button"
        onclick="addTimer()">
        タイマー追加
      </button>

    </div>

  </section>



  <!-- Active timers -->
  <section class="tool-section">

    <div class="section-header">

      <h2>Timers</h2>

      <button
        class="clear-button"
        id="clearAllBtn">
        All clear
      </button>

    </div>


    <ul id="timerList"></ul>

  </section>



  <!-- Completed timers -->
  <section class="tool-section">

    <h2
      id="finishedToggle"
      class="toggle-heading">
      Completed（0件）▼
    </h2>


    <ul
      id="finishedList"
      style="display:none;">
    </ul>

  </section>


</main>
  
<script>
/* =========================
   環境判定・ストレージキー設定
   ・URLに '/labs/' が含まれる場合は Labs専用キーを使用
   ・将来このコードが安定版へ反映された場合は自動で安定版キーに切り替わる
========================= */
const isLabs = window.location.pathname.includes('/labs/');
const STORAGE_KEY_TIMERS = isLabs ? "labs_timers_v2" : "timers_v2";
const STORAGE_KEY_VOLUME = isLabs ? "labs_timer_volume" : "timer_volume";
const STORAGE_KEY_VIEW = isLabs ? "labs_timer_view_mode" : "timer_view_mode";

let timerId = 0;
let timers = [];
let finishedOpen = false;

/* =========================
   音声
========================= */
let audioCtx = null;

function initAudio() {

  try {

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!audioCtx) {
      audioCtx = new AC();
    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

  } catch(e) {

    console.log("audio unavailable");
  }
}

function getVolumeLevel() {

  const selected =
    document.querySelector(
      'input[name="volume"]:checked'
    );

  return selected
    ? Number(selected.value)
    : 0.05;
}

function beepAt(startTime) {

  if (!audioCtx) return;

  const volume = getVolumeLevel();

  if (volume <= 0) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  // 三角波（triangle）：適度な倍音を含み、動画やBGMを抜けて聞き取りやすい音色
  osc.type = "triangle";
  // 人間の耳が感度高く聞き取りやすい周波数帯（約988Hz）
  osc.frequency.value = 987.77;

  gain.gain.setValueAtTime(0.001, startTime);

  // 素早く立ち上げ
  gain.gain.linearRampToValueAtTime(
    volume,
    startTime + 0.015
  );

  // ピーク音量をキープして音圧をしっかり稼ぐ（埋もれ防止）
  gain.gain.setValueAtTime(
    volume,
    startTime + 0.11
  );

  // 自然に減衰
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    startTime + 0.17
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(startTime);
  osc.stop(startTime + 0.18);
}

function playBeepTwice() {

  if (!audioCtx) return;

  const now = audioCtx.currentTime;

  beepAt(now);
  beepAt(now + 0.22);
}

/* =========================
   要素
========================= */
const timeInput =
  document.getElementById("timeInput");

const testSoundBtn =
  document.getElementById("testSoundBtn");

const memoText =
  document.getElementById("memoText");

/* =========================
   ラベルUI
========================= */
function updateLabelUI() {

  const selected =
    document.querySelector(
      'input[name="labelType"]:checked'
    );

  const isText =
    selected.value === "text";

  memoText.disabled = !isText;

  if (!isText) {
    memoText.value = "";
  }
}

/* =========================
   試聴ボタン
========================= */
function updateTestButtonState() {

  const muted =
    getVolumeLevel() === 0;

  testSoundBtn.disabled = muted;

  testSoundBtn.title =
    muted ? "ミュート中" : "試聴";
}

/* =========================
   音量保存
========================= */
function saveVolumeSetting() {

  const selected =
    document.querySelector(
      'input[name="volume"]:checked'
    );

  if (!selected) return;

  localStorage.setItem(
    STORAGE_KEY_VOLUME,
    selected.value
  );
}

function loadVolumeSetting() {

  const saved =
    localStorage.getItem(STORAGE_KEY_VOLUME);

  if (!saved) return;

  let target =
    document.querySelector(
      `input[name="volume"][value="${saved}"]`
    );

  // 旧バージョンで保存された値との互換性
  if (!target) {
    if (saved === "0.18") target = document.querySelector('input[name="volume"][value="0.2"]');
    if (saved === "0.42") target = document.querySelector('input[name="volume"][value="0.45"]');
    if (saved === "0.85") target = document.querySelector('input[name="volume"][value="1.0"]');
  }

  if (target) {
    target.checked = true;
  }
}

document
  .querySelectorAll('input[name="volume"]')
  .forEach(radio => {

    radio.addEventListener("change", () => {

      saveVolumeSetting();
      updateTestButtonState();

    });

});

document
  .querySelectorAll('input[name="labelType"]')
  .forEach(radio => {

    radio.addEventListener(
      "change",
      updateLabelUI
    );

});

/* 試聴 */
testSoundBtn.addEventListener("click", () => {

  initAudio();
  playBeepTwice();

  if (typeof gtag === "function") {
    gtag("event", "timer_sound_test");
  }
});

/* =========================
   時間パース
========================= */
function parseTimeFlexible(input) {

  if (!input) return null;

  input = input.trim();

  if (input.includes(":")) {

    const p =
      input.split(":").map(Number);

    if (p.length === 3) {
      return p[0] * 3600
           + p[1] * 60
           + p[2];
    }

    if (p.length === 2) {
      return p[0] * 60 + p[1];
    }

    return null;
  }

  if (!/^\d+$/.test(input)) {
    return null;
  }

  const str =
    input.padStart(6, "0");

  const h =
    Number(str.slice(0, -4)) || 0;

  const m =
    Number(str.slice(-4, -2));

  const s =
    Number(str.slice(-2));

  if (m >= 60 || s >= 60) {
    return null;
  }

  return h * 3600 + m * 60 + s;
}

/* =========================
   指定時刻
========================= */
function parseTargetTime(input) {

  if (!input) return null;

  input = input.trim();

  let h = 0;
  let m = 0;
  let s = 0;

  if (input.includes(":")) {

    const p =
      input.split(":").map(Number);

    if (p.length === 2) {

      h = p[0];
      m = p[1];

    } else if (p.length === 3) {

      h = p[0];
      m = p[1];
      s = p[2];

    } else {

      return null;
    }

  } else {

    if (!/^\d+$/.test(input)) {
      return null;
    }

    const str =
      input.padStart(6, "0");

    h = Number(str.slice(0, -4)) || 0;
    m = Number(str.slice(-4, -2));
    s = Number(str.slice(-2));
  }

  if (h > 23 || m > 59 || s > 59) {
    return null;
  }

  const now = new Date();

  const target = new Date();

  target.setHours(h, m, s, 0);

  if (target.getTime() <= now.getTime()) {
    target.setDate(target.getDate() + 1);
  }

  return target.getTime();
}

/* =========================
   共通
========================= */
function formatTime(sec) {

  const h =
    Math.floor(sec / 3600);

  const m =
    Math.floor((sec % 3600) / 60);

  const s =
    sec % 60;

  return String(h).padStart(2, "0")
    + ":"
    + String(m).padStart(2, "0")
    + ":"
    + String(s).padStart(2, "0");
}

function getMode() {

  return document.querySelector(
    'input[name="mode"]:checked'
  ).value;
}

function formatTimerId(id) {

  return String(id).padStart(2, "0");
}

/* =========================
   Enter追加
========================= */
timeInput.addEventListener(
  "keydown",
  (e) => {

    if (
      e.key === "Enter" &&
      !e.isComposing
    ) {

      e.preventDefault();
      addTimer();
    }
});

/* =========================
   モードUI
========================= */
function updateModeUI() {

  const mode = getMode();

  if (mode === "duration") {

    timeInput.placeholder =
      "15:30 / 1530 / 00:15:30";

  } else {

    timeInput.placeholder =
      "183015 / 18:30:15";
  }

  timeInput.value = "";
}

document
  .querySelectorAll('input[name="mode"]')
  .forEach(r => {

    r.addEventListener(
      "change",
      updateModeUI
    );

});

/* blur整形 */
timeInput.addEventListener("blur", () => {

  if (getMode() !== "duration") {
    return;
  }

  const sec =
    parseTimeFlexible(timeInput.value);

  if (sec !== null) {
    timeInput.value = formatTime(sec);
  }
});

/* =========================
   保存
========================= */
function saveTimers() {

  const saveData =
    timers.map(t => ({
      id: t.id,
      labelType: t.labelType,
      labelText: t.labelText,
      target: t.target,
      completed: t.completed,
      endGraceUntil: t.endGraceUntil
    }));

  localStorage.setItem(
    STORAGE_KEY_TIMERS,
    JSON.stringify(saveData)
  );
}

function loadTimers() {

  const data =
    localStorage.getItem(STORAGE_KEY_TIMERS);

  if (!data) return;

  const loaded =
    JSON.parse(data);

  const now = Date.now();

  timers = loaded
    .filter(t =>
      now <= t.target + 5 * 60 * 1000 &&
      t.completed !== true
    )
    .map(t => ({
      ...t,
      interval: null
    }));

  timerId =
    timers.reduce(
      (max, t) =>
        Math.max(max, t.id),
      0
    );
}

/* =========================
   追加
========================= */
function addTimer() {

  initAudio();

  const selectedLabel =
    document.querySelector(
      'input[name="labelType"]:checked'
    );

  const labelType =
    selectedLabel.value === "text"
      ? "text"
      : "emoji";

  let labelText = "";

  if (labelType === "text") {

    labelText =
      memoText.value.trim() || "memo";

  } else {

    labelText = selectedLabel.value;
  }

  const input =
    timeInput.value.trim();

  const mode = getMode();

  let target;
  let secForLog = 0;

  if (mode === "duration") {

    const sec =
      parseTimeFlexible(input);

    if (!sec || sec <= 0) {

      alert("時間形式が不正です");
      return;
    }

    target =
      Date.now() + sec * 1000;

    secForLog = sec;

  } else {

    target =
      parseTargetTime(input);

    if (!target) {

      alert("時刻形式が不正です");
      return;
    }

    secForLog =
      Math.floor(
        (target - Date.now()) / 1000
      );
  }

  if (typeof gtag === "function") {

    gtag("event", "timer_add", {
      mode: mode,
      seconds: secForLog
    });
  }

  timers.push({
    id: ++timerId,
    labelType,
    labelText,
    target,
    interval: null,
    endGraceUntil: null,
    completed: false
  });

  saveTimers();
  renderTimers();

  timeInput.value = "";
  timeInput.focus();
}

/* =========================
   削除
========================= */
function removeTimer(id) {

  if (typeof gtag === "function") {
    gtag("event", "timer_remove");
  }

  const i =
    timers.findIndex(
      t => t.id === id
    );

  if (i === -1) return;

  timers.splice(i, 1);

  saveTimers();
  renderTimers();
}

/* =========================
   オールクリア
========================= */
document
  .getElementById("clearAllBtn")
  .addEventListener("click", () => {

    if (
      !confirm(
        "保存済みタイマーをすべて削除しますか？"
      )
    ) {
      return;
    }

    timers = [];
    timerId = 0;

    localStorage.removeItem(STORAGE_KEY_TIMERS);

    renderTimers();
});

/* =========================
   完了開閉
========================= */
document
  .getElementById("finishedToggle")
  .onclick = () => {

  finishedOpen = !finishedOpen;

  document.getElementById(
    "finishedList"
  ).style.display =
    finishedOpen
      ? "block"
      : "none";

  document.getElementById(
    "finishedToggle"
  ).textContent =
    `Completed（${document.getElementById("finishedList").children.length}件）`
    + (finishedOpen ? "▲" : "▼");
};

/* =========================
   描画
========================= */
function renderTimers() {

  const now = Date.now();

  const active = [];
  const finished = [];

  timers.forEach(t => {

    if (now <= t.target) {

      active.push(t);

    } else {

      if (!t.endGraceUntil) {
        t.endGraceUntil =
          t.target + 5 * 60 * 1000;
      }

      if (now <= t.endGraceUntil) {

        active.push(t);

      } else {

        finished.push(t);
      }
    }
  });

  active.sort(
    (a, b) => a.target - b.target
  );

  finished.sort(
    (a, b) => b.target - a.target
  );

  drawList("timerList", active);
  drawList("finishedList", finished);

  document.getElementById(
    "finishedToggle"
  ).textContent =
    `Completed（${finished.length}件）`
    + (finishedOpen ? "▲" : "▼");

  saveTimers();
}

/* =========================
   リスト描画
========================= */
function drawList(id, list) {

  const ul =
    document.getElementById(id);

  ul.innerHTML = "";
  const now = Date.now();

  list.forEach(t => {

    const li =
      document.createElement("li");

    li.className =
      "timer-item compact-timer-item";
    li.setAttribute("data-timer-id", t.id);

    const labelDisplay =
      t.labelType === "text"
        ? `【${t.labelText}】`
        : t.labelText;

    const diff = t.target - now;
    const remainText = diff <= 0
      ? "(終了)"
      : "(残り: " + formatTime(Math.floor(diff / 1000)) + ")";

    li.innerHTML = `
      <span class="timer-label">
        #${formatTimerId(t.id)} ${labelDisplay}
      </span>

      <span class="timer-target">
        ${new Date(t.target).toLocaleTimeString()}
      </span>

      <span class="remain">
        ${remainText}
      </span>

      <button
        class="mini-button icon-button"
        title="削除"
        onclick="removeTimer(${t.id})">

        🗑

      </button>
    `;

    ul.appendChild(li);
  });
}

/* =========================
   毎秒のタイマー更新（集中ティッカー）
========================= */
function onTick() {

  const now = Date.now();
  let needReorder = false;

  timers.forEach(t => {

    const diff = t.target - now;

    if (diff <= 0) {

      if (t.completed !== true) {

        t.completed = true;
        saveTimers();

        if (getVolumeLevel() > 0) {
          initAudio();
          playBeepTwice();
        }

        if (typeof gtag === "function") {
          gtag("event", "timer_complete");
        }

        needReorder = true;
      }
    }

    if (!t.endGraceUntil && diff <= 0) {
      t.endGraceUntil = t.target + 5 * 60 * 1000;
    }

    if (t.endGraceUntil && now > t.endGraceUntil) {
      needReorder = true;
    }

    const remainEl =
      document.querySelector(`[data-timer-id="${t.id}"] .remain`);

    if (remainEl) {
      if (diff <= 0) {
        remainEl.textContent = "(終了)";
      } else {
        remainEl.textContent =
          "(残り: " + formatTime(Math.floor(diff / 1000)) + ")";
      }
    }
  });

  if (needReorder) {
    renderTimers();
  }
}

/* =========================
   Web Worker（バックグラウンド遅延解消）
========================= */
let timerWorker = null;

function initWorker() {

  try {

    const workerCode = `
      let timer = null;
      self.onmessage = function(e) {
        if (e.data === "start") {
          if (!timer) {
            timer = setInterval(() => self.postMessage("tick"), 1000);
          }
        } else if (e.data === "stop") {
          if (timer) {
            clearInterval(timer);
            timer = null;
          }
        }
      };
    `;

    const blob = new Blob([workerCode], { type: "application/javascript" });
    timerWorker = new Worker(URL.createObjectURL(blob));

    timerWorker.onmessage = function(e) {
      if (e.data === "tick") {
        onTick();
      }
    };

    timerWorker.postMessage("start");

  } catch(e) {

    console.warn("Web Worker unavailable, falling back to setInterval", e);
    setInterval(onTick, 1000);
  }
}

/* タブ復帰時のリフレッシュ */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    initAudio();
    renderTimers();
  }
});

/* =========================
   ビュー切り替え（左右寄せ・スリム表示）
========================= */
function setViewMode(mode) {
  const mainEl = document.querySelector("main");
  if (!mainEl) return;

  mainEl.classList.remove("view-left", "view-right", "view-center");
  mainEl.classList.add(`view-${mode}`);

  document.querySelectorAll(".view-btn").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-view") === mode);
  });

  try {
    localStorage.setItem(STORAGE_KEY_VIEW, mode);
  } catch(e) {}
}

function initViewMode() {
  const saved = localStorage.getItem(STORAGE_KEY_VIEW) || "center";
  setViewMode(saved);

  document.querySelectorAll(".view-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const mode = btn.getAttribute("data-view");
      setViewMode(mode);
    });
  });
}

/* =========================
   初期化
========================= */
initViewMode();

loadTimers();

loadVolumeSetting();

updateModeUI();

updateLabelUI();

updateTestButtonState();

renderTimers();

initWorker();
</script>

<!-- footer -->
<div id="footer"></div>

<script>
fetch("footer.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("footer").innerHTML = data;
  });
</script>

</body>
